name: Build image

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packer/**"
      - "images/**"
      - "providers/**"
      - "build.sh"
      - "action.yml"
  schedule:
    # Weekly, to pick up security updates.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to build (a folder in providers/). Leave empty to build all of them.
        type: string
        default: ""
      ubuntu_version:
        description: Ubuntu LTS version
        type: string
        default: "26.04"
      arch:
        description: CPU architecture
        type: choice
        options: [x86_64, arm64]
        default: x86_64

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=github-releases depName=hashicorp/packer extractVersion=^v(?<version>.+)$
  PACKER_VERSION: "1.16.2"
  # packer init downloads plugins through the GitHub API.
  PACKER_GITHUB_API_TOKEN: ${{ github.token }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: packer fmt and validate, every provider
        run: ./build.sh validate
      - name: shellcheck
        run: grep -rlE '^#!/usr/bin/env bash' --exclude-dir=.git . | xargs shellcheck
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  runner-version:
    name: Runner version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A stale runner only fails the weekly build; other runs show it as a warning.
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - run: images/ubuntu/check-runner-version.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build (${{ matrix.provider }})
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # id-token: for providers that log in with GitHub's OIDC token instead of a
    # long-lived secret (Azure).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Providers to build: the one picked in a manual run, otherwise all of these.
        provider: ${{ fromJSON(inputs.provider && format('["{0}"]', inputs.provider) || '["hetzner", "azure"]') }}
    # Holds the provider's secrets, so each leg only sees its own.
    environment: ${{ matrix.provider }}
    concurrency:
      group: build-image-${{ matrix.provider }}
      cancel-in-progress: false
    env:
      PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v7

      # Exports the secrets that providers/<name>/ci/credentials lists, so this
      # workflow doesn't need to know any provider's secret names. Names ending
      # in ? are optional.
      - name: Load credentials from the ${{ matrix.provider }} environment
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          while read -r name; do
            optional=false
            if [[ $name == *'?' ]]; then
              name=${name%'?'}
              optional=true
            fi
            value=$(jq -r --arg name "$name" '.[$name] // empty' <<<"$SECRETS")
            if [[ -z $value ]]; then
              $optional && continue
              echo "::error::Secret $name is missing from the $PROVIDER environment (see providers/$PROVIDER/README.md)"
              exit 1
            fi
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >>"$GITHUB_ENV"
          done < <(grep -v -e '^#' -e '^[[:space:]]*$' "providers/$PROVIDER/ci/credentials")

      # The action in this repository (action.yml), the one other repositories
      # use too. It runs `build.sh release`: build, test on a new server, promote
      # and prune, or delete everything it created if a step fails. It also
      # writes the job summary.
      - name: Build, test and release
        id: image
        uses: ./
        with:
          provider: ${{ matrix.provider }}
          ubuntu-version: ${{ inputs.ubuntu_version || '26.04' }}
          arch: ${{ inputs.arch || 'x86_64' }}
          packer-version: ${{ env.PACKER_VERSION }}
        env:
          PKR_VAR_commit: ${{ github.sha }}

      - name: Upload the manifest and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.provider }}-${{ steps.image.outputs.version }}-${{ github.run_attempt }}
          path: |
            output/manifest.json
            output/build.log
            output/smoke.log
            output/release.json
          if-no-files-found: ignore
