name: Build image

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packer/**"
      - "images/**"
      - "providers/**"
  schedule:
    # Weekly, to pick up security updates.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to build (a folder in providers/). Leave empty to build all of them.
        type: string
        default: ""
      ubuntu_version:
        description: Ubuntu LTS version
        type: string
        default: "26.04"
      arch:
        description: CPU architecture
        type: choice
        options: [x86_64, arm64]
        default: x86_64

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=github-releases depName=hashicorp/packer extractVersion=^v(?<version>.+)$
  PACKER_VERSION: "1.16.2"
  # packer init downloads plugins through the GitHub API.
  PACKER_GITHUB_API_TOKEN: ${{ github.token }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: packer fmt and validate, every provider
        run: ./build.sh validate
      - name: shellcheck
        run: grep -rlE '^#!/usr/bin/env bash' --exclude-dir=.git . | xargs shellcheck
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  runner-version:
    name: Runner version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A stale runner only fails the weekly build; other runs show it as a warning.
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - run: images/ubuntu/check-runner-version.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build (${{ matrix.provider }})
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Providers to build: the one picked in a manual run, otherwise all of these.
        provider: ${{ fromJSON(inputs.provider && format('["{0}"]', inputs.provider) || '["hetzner"]') }}
    # Holds the provider's secrets, so each leg only sees its own.
    environment: ${{ matrix.provider }}
    concurrency:
      group: build-image-${{ matrix.provider }}
      cancel-in-progress: false
    env:
      PROVIDER: ${{ matrix.provider }}
      PKR_VAR_ubuntu_version: ${{ inputs.ubuntu_version || '26.04' }}
      PKR_VAR_arch: ${{ inputs.arch || 'x86_64' }}
      PKR_VAR_commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Set the image version
        run: echo "PKR_VAR_image_version=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >>"$GITHUB_ENV"

      # Exports the secrets that providers/<name>/ci/credentials lists, so this
      # workflow doesn't need to know any provider's secret names.
      - name: Load credentials from the ${{ matrix.provider }} environment
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          while read -r name; do
            value=$(jq -r --arg name "$name" '.[$name] // empty' <<<"$SECRETS")
            if [[ -z $value ]]; then
              echo "::error::Secret $name is missing from the $PROVIDER environment (see providers/$PROVIDER/README.md)"
              exit 1
            fi
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >>"$GITHUB_ENV"
          done < <(grep -v -e '^#' -e '^[[:space:]]*$' "providers/$PROVIDER/ci/credentials")

      - name: Validate
        run: ./build.sh validate "$PROVIDER"

      - name: Build
        run: ./build.sh build "$PROVIDER"

      - name: Upload the manifest and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.provider }}-${{ env.PKR_VAR_image_version }}
          path: |
            output/manifest.json
            output/build.log
          if-no-files-found: ignore

      - name: Find the image
        run: |
          read -r id size < <(providers/"$PROVIDER"/ci/find-image "$PKR_VAR_image_version")
          echo "Image $id, $size GB"
          echo "IMAGE_ID=$id" >>"$GITHUB_ENV"
          echo "IMAGE_SIZE_GB=$size" >>"$GITHUB_ENV"

      - name: Start a test server
        id: server
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/smoke_key"
          echo "created_at=$(date +%s)" >>"$GITHUB_OUTPUT"
          out=$(providers/"$PROVIDER"/ci/create-test-server "$IMAGE_ID" "$RUNNER_TEMP/smoke_key.pub")
          read -r id ip <<<"$out"
          echo "Server $id at $ip"
          echo "id=$id" >>"$GITHUB_OUTPUT"
          echo "ip=$ip" >>"$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          SERVER_IP: ${{ steps.server.outputs.ip }}
          SERVER_CREATED_AT: ${{ steps.server.outputs.created_at }}
        run: images/ubuntu/tests/run-smoke.sh "$SERVER_IP" "$RUNNER_TEMP/smoke_key" | tee "$RUNNER_TEMP/smoke.log"

      - name: Delete the test server
        if: always() && steps.server.outputs.id != ''
        run: providers/"$PROVIDER"/ci/delete-server "${{ steps.server.outputs.id }}"

      - name: Promote to stable
        id: promote
        run: providers/"$PROVIDER"/ci/promote "$IMAGE_ID"

      - name: Delete old stable images
        run: providers/"$PROVIDER"/ci/prune 2

      - name: Delete the candidate image
        if: (failure() || cancelled()) && steps.promote.outcome != 'success'
        run: |
          id=${IMAGE_ID:-}
          if [[ -z $id ]]; then
            # The build may have saved an image before the job stopped.
            id=$(providers/"$PROVIDER"/ci/find-image "$PKR_VAR_image_version" 2>/dev/null | cut -d ' ' -f 1) || true
          fi
          if [[ -n $id ]]; then
            providers/"$PROVIDER"/ci/delete-image "$id"
          else
            echo "No image to delete."
          fi

      - name: Summary
        if: always()
        env:
          PROMOTED: ${{ steps.promote.outcome == 'success' }}
        run: |
          build_time=$(sed -n 's/^Build took //p' output/build.log 2>/dev/null || true)
          ssh_ready=$(sed -n 's/^ssh_ready_seconds=//p' "$RUNNER_TEMP/smoke.log" 2>/dev/null || true)
          smoke=$(sed -n 's/^smoke test: //p' "$RUNNER_TEMP/smoke.log" 2>/dev/null || true)
          {
            echo "### $PROVIDER image $PKR_VAR_image_version"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ubuntu | $PKR_VAR_ubuntu_version, $PKR_VAR_arch |"
            echo "| Commit | \`${PKR_VAR_commit:0:12}\` |"
            echo "| Image ID | ${IMAGE_ID:-none} |"
            echo "| Image size | ${IMAGE_SIZE_GB:-?} GB |"
            echo "| Build time | ${build_time:-?} |"
            echo "| Test server SSH ready after | ${ssh_ready:-?} s |"
            echo "| Smoke test | ${smoke:-did not run} |"
            echo "| Channel | $([[ $PROMOTED == true ]] && echo stable || echo "not promoted") |"
            if [[ -s $RUNNER_TEMP/smoke.log ]]; then
              echo
              echo "<details><summary>Smoke test output</summary>"
              echo
              echo '```'
              cat "$RUNNER_TEMP/smoke.log"
              echo '```'
              echo "</details>"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
